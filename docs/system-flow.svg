<rect x="960" y="1780" width="890" height="190" rx="20" fill="white" stroke="#A86A13" stroke-width="2"/>
<text x="988.0" y="1829.0" fill="#182B47" font-family="Meiryo, sans-serif" font-size="32" font-weight="700">Webで企業を調査し、評価へ戻る</text>
<text x="988.0" y="1876.0" fill="#52647C" font-family="Meiryo, sans-serif" font-size="27" font-weight="400">企業ごとに公開情報を調べ、事実と出典を集める</text>
<text x="988.0" y="1916.0" fill="#52647C" font-family="Meiryo, sans-serif" font-size="27" font-weight="400">新たに得た情報も使い、希望との相性を評価する</text>
<polyline points="960,1875 902,1875 902,1155 920,1155" fill="none" stroke="#A86A13" stroke-width="4" stroke-linejoin="round"/>
<polygon points="920.0,1155.0 904.7,1162.4 904.7,1147.6" fill="#A86A13"/>
<text x="1060.0" y="2021.0" fill="#52647C" font-family="Meiryo, sans-serif" font-size="25" font-weight="400">追加調査後に候補を確定し、条件未達の点も明示。</text>
<polyline points="1730,1420 1952,1420 1952,865 2020,865" fill="none" stroke="#087F80" stroke-width="4" stroke-linejoin="round"/>
