<text x="1281.0" y="1407.0" fill="#182B47" font-family="Meiryo, sans-serif" font-size="31" font-weight="700">条件に合う企業が</text>
<text x="1281.0" y="1455.0" fill="#182B47" font-family="Meiryo, sans-serif" font-size="31" font-weight="700">目標数に達した？</text>
<polyline points="1405,1520 1405,1590" fill="none" stroke="#A86A13" stroke-width="4" stroke-linejoin="round"/>
