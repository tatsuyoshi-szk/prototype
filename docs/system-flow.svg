<text x="70.0" y="533.0" fill="#52647C" font-family="Meiryo, sans-serif" font-size="24" font-weight="400">利用の流れ ↑     ／     提案につながる仕組み ↓</text>
<rect x="70" y="565" width="760" height="1490" rx="24" fill="white" stroke="#DCE4EF" stroke-width="2"/>
<text x="102.0" y="614.0" fill="#315ED1" font-family="Meiryo, sans-serif" font-size="24" font-weight="700">01  希望を理解する</text>
<text x="102.0" y="668.0" fill="#182B47" font-family="Meiryo, sans-serif" font-size="38" font-weight="700">相談とアンケート</text>
<text x="102.0" y="714.0" fill="#52647C" font-family="Meiryo, sans-serif" font-size="25" font-weight="400">対話と回答から、本人の価値観・希望条件を整理</text>
<rect x="880" y="565" width="1050" height="1490" rx="24" fill="white" stroke="#DCE4EF" stroke-width="2"/>
<text x="912.0" y="613.0" fill="#087F80" font-family="Meiryo, sans-serif" font-size="24" font-weight="700">02  企業との相性を確かめる</text>
<text x="912.0" y="668.0" fill="#182B47" font-family="Meiryo, sans-serif" font-size="38" font-weight="700">企業の調査と評価</text>
<text x="912.0" y="716.0" fill="#52647C" font-family="Meiryo, sans-serif" font-size="25" font-weight="400">15社を目標に、根拠を確かめながら候補を探索</text>
<rect x="1980" y="565" width="750" height="1490" rx="24" fill="white" stroke="#DCE4EF" stroke-width="2"/>
<text x="2012.0" y="613.0" fill="#315ED1" font-family="Meiryo, sans-serif" font-size="24" font-weight="700">03  比較・検討につなげる</text>
<text x="2012.0" y="670.0" fill="#182B47" font-family="Meiryo, sans-serif" font-size="38" font-weight="700">企業ランキングと提案理由</text>
<text x="2012.0" y="714.0" fill="#52647C" font-family="Meiryo, sans-serif" font-size="25" font-weight="400">相性の良さと、その理由をあわせて見せる</text>
<rect x="110" y="760" width="680" height="205" rx="20" fill="white" stroke="#315ED1" stroke-width="2"/>
<text x="138.0" y="801.0" fill="#315ED1" font-family="Meiryo, sans-serif" font-size="23" font-weight="700">日本語・英語で相談</text>
<text x="138.0" y="846.0" fill="#182B47" font-family="Meiryo, sans-serif" font-size="33" font-weight="700">AIとの対話で希望を深掘り</text>
<text x="138.0" y="893.0" fill="#52647C" font-family="Meiryo, sans-serif" font-size="27" font-weight="400">学生が経験・希望・不安を自分の言葉で話す</text>
<text x="138.0" y="934.0" fill="#52647C" font-family="Meiryo, sans-serif" font-size="27" font-weight="400">AIが質問を重ね、価値観や働き方を整理</text>
<polyline points="450,965 450,1015" fill="none" stroke="#315ED1" stroke-width="4" stroke-linejoin="round"/>
<polygon points="450.0,1015.0 442.6,999.7 457.4,999.7" fill="#315ED1"/>
<rect x="110" y="1015" width="680" height="155" rx="20" fill="white" stroke="#315ED1" stroke-width="2"/>
<text x="138.0" y="1065.0" fill="#182B47" font-family="Meiryo, sans-serif" font-size="33" font-weight="700">個人の就活軸を見つけ、確認</text>
<text x="138.0" y="1112.0" fill="#52647C" font-family="Meiryo, sans-serif" font-size="28" font-weight="400">本人が大切にしたいことを言語化する</text>
<polyline points="450,1170 450,1220" fill="none" stroke="#315ED1" stroke-width="4" stroke-linejoin="round"/>
<polygon points="450.0,1220.0 442.6,1204.7 457.4,1204.7" fill="#315ED1"/>
<rect x="110" y="1220" width="680" height="245" rx="20" fill="white" stroke="#315ED1" stroke-width="2"/>
<text x="138.0" y="1262.0" fill="#315ED1" font-family="Meiryo, sans-serif" font-size="23" font-weight="700">会社選びで何を大事にするか</text>
<text x="138.0" y="1306.0" fill="#182B47" font-family="Meiryo, sans-serif" font-size="33" font-weight="700">共通14項目＋個人軸を回答</text>
<text x="138.0" y="1351.0" fill="#52647C" font-family="Meiryo, sans-serif" font-size="26" font-weight="400">会社選びの各項目に重要度を1〜5で回答</text>
<text x="138.0" y="1391.0" fill="#52647C" font-family="Meiryo, sans-serif" font-size="26" font-weight="400">「譲れない」条件も指定できる</text>
<text x="138.0" y="1432.0" fill="#52647C" font-family="Meiryo, sans-serif" font-size="26" font-weight="400">企業のグローバル度などと個人の希望を評価</text>
<polyline points="450,1465 450,1520" fill="none" stroke="#315ED1" stroke-width="4" stroke-linejoin="round"/>
<polygon points="450.0,1520.0 442.6,1504.7 457.4,1504.7" fill="#315ED1"/>
<rect x="110" y="1520" width="680" height="210" rx="20" fill="white" stroke="#315ED1" stroke-width="2"/>
<text x="138.0" y="1561.0" fill="#315ED1" font-family="Meiryo, sans-serif" font-size="23" font-weight="700">アンケート送信後に企業探しを開始</text>
<text x="138.0" y="1606.0" fill="#182B47" font-family="Meiryo, sans-serif" font-size="33" font-weight="700">本人に合う企業を探す準備</text>
<text x="138.0" y="1653.0" fill="#52647C" font-family="Meiryo, sans-serif" font-size="27" font-weight="400">何をどれだけ重視するかを、回答から整理</text>
<text x="138.0" y="1693.0" fill="#52647C" font-family="Meiryo, sans-serif" font-size="27" font-weight="400">就活軸と譲れない条件を企業選びに反映</text>
<text x="115.0" y="1807.0" fill="#315ED1" font-family="Meiryo, sans-serif" font-size="27" font-weight="700">相談で見つけた軸を、企業選びにつなげる。</text>
<text x="115.0" y="1863.0" fill="#52647C" font-family="Meiryo, sans-serif" font-size="26" font-weight="400">会話・アンケート・結果は同じ流れで確認。</text>
<text x="115.0" y="1911.0" fill="#52647C" font-family="Meiryo, sans-serif" font-size="26" font-weight="400">途中で離れても、続きから利用できる。</text>
