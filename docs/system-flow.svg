<rect x="960" y="1590" width="890" height="140" rx="20" fill="white" stroke="#A86A13" stroke-width="2"/>
<text x="988.0" y="1639.0" fill="#182B47" font-family="Meiryo, sans-serif" font-size="31" font-weight="700">就活軸と希望条件から新たな企業を選ぶ</text>
<text x="988.0" y="1684.0" fill="#52647C" font-family="Meiryo, sans-serif" font-size="27" font-weight="400">すでに調べた企業との重複を避けて、候補を広げる</text>
<polyline points="1405,1730 1405,1780" fill="none" stroke="#A86A13" stroke-width="4" stroke-linejoin="round"/>
