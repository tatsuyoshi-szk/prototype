<text x="1175.0" y="393.0" fill="#182B47" font-family="Meiryo, sans-serif" font-size="36" font-weight="700">重要度を回答</text>
<text x="1175.0" y="444.0" fill="#52647C" font-family="Meiryo, sans-serif" font-size="27" font-weight="400">優先順位と譲れない条件</text>
