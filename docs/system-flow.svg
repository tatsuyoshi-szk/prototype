<rect x="1748" y="1333" width="176" height="70" rx="0" fill="white" stroke="white" stroke-width="2"/>
<text x="1775.5" y="1356.0" fill="#087F80" font-family="Meiryo, sans-serif" font-size="25" font-weight="700">目標達成／</text>
<text x="1788.0" y="1395.0" fill="#087F80" font-family="Meiryo, sans-serif" font-size="25" font-weight="700">調査完了</text>
<rect x="2020" y="760" width="670" height="250" rx="20" fill="white" stroke="#315ED1" stroke-width="2"/>
<text x="2048.0" y="810.0" fill="#182B47" font-family="Meiryo, sans-serif" font-size="33" font-weight="700">比較する企業候補を確定</text>
<text x="2048.0" y="855.0" fill="#52647C" font-family="Meiryo, sans-serif" font-size="26" font-weight="400">条件を満たす企業を優先して選ぶ</text>
<text x="2048.0" y="896.0" fill="#52647C" font-family="Meiryo, sans-serif" font-size="26" font-weight="400">候補が不足するときは、近い企業も含める</text>
<text x="2048.0" y="935.0" fill="#52647C" font-family="Meiryo, sans-serif" font-size="26" font-weight="400">その場合、満たしていない条件を明示</text>
<text x="2048.0" y="976.0" fill="#52647C" font-family="Meiryo, sans-serif" font-size="26" font-weight="400">本人の重要度と企業ごとの評価をまとめる</text>
<polyline points="2355,1010 2355,1060" fill="none" stroke="#315ED1" stroke-width="4" stroke-linejoin="round"/>
<polygon points="2355.0,1060.0 2347.6,1044.7 2362.4,1044.7" fill="#315ED1"/>
<rect x="2020" y="1060" width="670" height="355" rx="20" fill="white" stroke="#315ED1" stroke-width="2"/>
<text x="2048.0" y="1101.0" fill="#315ED1" font-family="Meiryo, sans-serif" font-size="23" font-weight="700">相性を100点満点の総合点に</text>
<text x="2048.0" y="1145.0" fill="#182B47" font-family="Meiryo, sans-serif" font-size="32" font-weight="700">本人との相性で順位をつける</text>
<text x="2048.0" y="1192.0" fill="#52647C" font-family="Meiryo, sans-serif" font-size="27" font-weight="400">① 譲れない条件を満たす企業が先</text>
<text x="2048.0" y="1233.0" fill="#52647C" font-family="Meiryo, sans-serif" font-size="27" font-weight="400">② 条件未達が少ない企業を優先</text>
<text x="2048.0" y="1274.0" fill="#52647C" font-family="Meiryo, sans-serif" font-size="27" font-weight="400">③ 根拠が少ない企業は順位を下げる</text>
<text x="2048.0" y="1315.0" fill="#52647C" font-family="Meiryo, sans-serif" font-size="27" font-weight="400">④ 同じ条件の中で総合点が高い順</text>
<text x="2048.0" y="1355.0" fill="#52647C" font-family="Meiryo, sans-serif" font-size="27" font-weight="400">根拠のある評価と本人の重要度で計算</text>
<polyline points="2355,1415 2355,1475" fill="none" stroke="#315ED1" stroke-width="4" stroke-linejoin="round"/>
<polygon points="2355.0,1475.0 2347.6,1459.7 2362.4,1459.7" fill="#315ED1"/>
<rect x="2020" y="1475" width="670" height="265" rx="20" fill="white" stroke="#315ED1" stroke-width="2"/>
<text x="2048.0" y="1518.0" fill="#315ED1" font-family="Meiryo, sans-serif" font-size="23" font-weight="700">企業ランキングと提案理由</text>
<text x="2048.0" y="1559.0" fill="#182B47" font-family="Meiryo, sans-serif" font-size="31" font-weight="700">上位5社と、ほかの候補を表示</text>
<text x="2048.0" y="1605.0" fill="#52647C" font-family="Meiryo, sans-serif" font-size="26" font-weight="400">合う点・気になる点と、その根拠を示す</text>
<text x="2048.0" y="1644.0" fill="#52647C" font-family="Meiryo, sans-serif" font-size="26" font-weight="400">条件の充足状況と未達の理由も見せる</text>
<text x="2048.0" y="1685.0" fill="#52647C" font-family="Meiryo, sans-serif" font-size="26" font-weight="400">出典をたどり、本人が比較・検討できる</text>
<rect x="2020" y="1805" width="670" height="168" rx="20" fill="#EEF3FD" stroke="#D8E2FA" stroke-width="2"/>
<text x="2048.0" y="1858.0" fill="#315ED1" font-family="Meiryo, sans-serif" font-size="29" font-weight="700">調査中も、進み具合がわかる</text>
<text x="2048.0" y="1911.0" fill="#52647C" font-family="Meiryo, sans-serif" font-size="26" font-weight="400">企業の選定・調査・評価の進捗を表示。</text>
<text x="2048.0" y="1954.0" fill="#52647C" font-family="Meiryo, sans-serif" font-size="26" font-weight="400">完了すると、そのまま結果を確認できる。</text>
<text x="70.0" y="2136.0" fill="#182B47" font-family="Meiryo, sans-serif" font-size="30" font-weight="700">この仕組みで支援できること</text>
<rect x="70" y="2172" width="860" height="175" rx="20" fill="white" stroke="#DCE4EF" stroke-width="2"/>
<text x="98.0" y="2222.0" fill="#182B47" font-family="Meiryo, sans-serif" font-size="29" font-weight="700">一人ひとりに合わせた提案</text>
<text x="98.0" y="2269.0" fill="#52647C" font-family="Meiryo, sans-serif" font-size="26" font-weight="400">本人の価値観・重要度・譲れない条件を、</text>
<text x="98.0" y="2315.0" fill="#52647C" font-family="Meiryo, sans-serif" font-size="26" font-weight="400">企業候補の選定と順位づけに反映。</text>
<rect x="970" y="2172" width="860" height="175" rx="20" fill="white" stroke="#DCE4EF" stroke-width="2"/>
<text x="998.0" y="2222.0" fill="#182B47" font-family="Meiryo, sans-serif" font-size="29" font-weight="700">根拠を確認できる企業比較</text>
<text x="998.0" y="2270.0" fill="#52647C" font-family="Meiryo, sans-serif" font-size="26" font-weight="400">相性の点数だけでなく、提案理由と出典を表示。</text>
<text x="998.0" y="2315.0" fill="#52647C" font-family="Meiryo, sans-serif" font-size="26" font-weight="400">確認できない情報や条件未達も、見える形に。</text>
<rect x="1870" y="2172" width="860" height="175" rx="20" fill="white" stroke="#DCE4EF" stroke-width="2"/>
<text x="1898.0" y="2222.0" fill="#182B47" font-family="Meiryo, sans-serif" font-size="29" font-weight="700">相談から企業選びまでを一貫して支援</text>
<text x="1898.0" y="2270.0" fill="#52647C" font-family="Meiryo, sans-serif" font-size="26" font-weight="400">対話で深めた自己理解を、具体的な企業提案へ。</text>
<text x="1898.0" y="2315.0" fill="#52647C" font-family="Meiryo, sans-serif" font-size="26" font-weight="400">本人が納得して検討するための材料を示す。</text>
<text x="70.0" y="2405.0" fill="#52647C" font-family="Meiryo, sans-serif" font-size="23" font-weight="400">※ 企業の評価・提案は確認できた公開情報に基づきます。情報の充実度によって、評価や順位は変わります。</text>
