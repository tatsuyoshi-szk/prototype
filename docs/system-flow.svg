<text x="1715.0" y="394.0" fill="#182B47" font-family="Meiryo, sans-serif" font-size="36" font-weight="700">企業を探す</text>
<text x="1715.0" y="444.0" fill="#52647C" font-family="Meiryo, sans-serif" font-size="27" font-weight="400">情報を調べ、相性を評価</text>
