<title>外国人留学生向け AI就活相談：利用の流れ</title>
<desc>相談から就活軸の発見、優先順位の設定、企業との相性評価、候補企業の比較までの利用フロー。</desc>
<rect width="2800" height="2440" fill="#F4F7FB"/>
<text x="70.0" y="76.0" fill="#315ED1" font-family="Meiryo, sans-serif" font-size="29" font-weight="700">外国人留学生向け  AI就活相談</text>
<text x="70.0" y="173.0" fill="#182B47" font-family="Meiryo, sans-serif" font-size="67" font-weight="700">対話から、根拠のある企業提案まで。</text>
<text x="70.0" y="239.0" fill="#52647C" font-family="Meiryo, sans-serif" font-size="33" font-weight="400">一人ひとりの就活軸と希望条件をもとに、自己理解から企業比較までを支援</text>
