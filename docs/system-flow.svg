<rect x="920" y="1040" width="970" height="230" rx="20" fill="white" stroke="#087F80" stroke-width="2"/>
<text x="948.0" y="1082.0" fill="#087F80" font-family="Meiryo, sans-serif" font-size="23" font-weight="700">希望条件と企業情報を照らし合わせる</text>
<text x="948.0" y="1127.0" fill="#182B47" font-family="Meiryo, sans-serif" font-size="34" font-weight="700">共通項目と個人の就活軸を評価</text>
<text x="948.0" y="1173.0" fill="#52647C" font-family="Meiryo, sans-serif" font-size="26" font-weight="400">共通14項目と個人軸の相性を、それぞれ1〜5で評価</text>
<text x="948.0" y="1213.0" fill="#52647C" font-family="Meiryo, sans-serif" font-size="26" font-weight="400">確認できた事実と出典に基づいて判断する</text>
<text x="948.0" y="1253.0" fill="#52647C" font-family="Meiryo, sans-serif" font-size="26" font-weight="400">譲れない条件は、4以上の評価と根拠があることが必要</text>
<polyline points="1405,1270 1405,1320" fill="none" stroke="#087F80" stroke-width="4" stroke-linejoin="round"/>
