<text x="948.0" y="858.0" fill="#52647C" font-family="Meiryo, sans-serif" font-size="28" font-weight="400">公開情報をもとに、希望条件に合う企業を探す</text>
<text x="948.0" y="900.0" fill="#52647C" font-family="Meiryo, sans-serif" font-size="28" font-weight="400">譲れない条件について、裏付けとなる情報を確認</text>
<text x="948.0" y="941.0" fill="#52647C" font-family="Meiryo, sans-serif" font-size="28" font-weight="400">個人の就活軸との相性を考慮し、候補を選定</text>
