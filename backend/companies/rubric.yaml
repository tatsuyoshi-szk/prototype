# 共通項目14個の採点基準（グローバル度_評価指標_new.csv を写したもの。CSVの「?」は「〜」に直した）
# 各項目を 1〜5点で採点する。該当する記述がなければ、基準の「言及なし／確認できない」の点（多くは1点）にする。
items:
- id: foreign_staff_ratio
  qid: Q1
  name: 外国籍社員の割合
  basis: 実測値
  levels:
    1: 1%未満
    2: 1%以上3%未満
    3: 3%以上5%未満
    4: 5%以上10%未満
    5: 10%以上
- id: foreign_manager_ratio
  qid: Q2
  name: 外国籍役員・管理職の割合
  basis: 実測値
  levels:
    1: 外国籍の管理職がいない
    2: 1〜2名（管理職の1%未満）
    3: 3名以上、または管理職の1%以上3%未満
    4: 管理職の3%以上10%未満、または役員に外国籍がいる
    5: 管理職の10%以上で、昇進基準が公開されている
- id: evaluation_system
  qid: Q3
  name: 評価・等級制度の形式
  basis: 調査から総合的に評価
  levels:
    1: 国籍による差の指摘が複数ある
    2: 具体的な事例が1件ある
    3: 具体的な事例はないが、不安の声がある
    4: 差の指摘がなく、制度は国籍を問わず共通
    5: 評価・給与の基準を公開し、国籍による差がないデータもある
- id: english_selection
  qid: Q4
  name: 選考プロセスに英語が使えるか
  basis: 調査から総合的に評価
  levels:
    1: 英語を完全に使えない
    2: ESのみ英語可
    3: 3つ未満の選考ルートで英語可
    4: 3つ以上の選考ルートで英語可
    5: 完全に英語で可能
- id: required_japanese
  qid: Q5
  name: 要求される日本語のレベル
  basis: 調査から総合的に評価
  levels:
    1: 言及なし
    2: ネイティブレベルの日本語
    3: N1
    4: N2
    5: 日本語レベルによる制限はなしと言及
- id: multilingual_docs
  qid: Q6
  name: 社内ツール・ドキュメントの多言語対応度
  basis: 調査から総合的に評価
  levels:
    1: 多言語対応への言及なし
    2: 対外文書（IR・報告書）のみ英語版がある
    3: 一部の社内文書・システムが英語に対応
    4: 主要な社内システム・規程が英語に対応
    5: 原則すべて英日併記で、英語のみで業務が完結する
- id: visa_support
  qid: Q7
  name: ビザ取得サポートの充実度
  basis: 調査から総合的に評価
  levels:
    1: 言及なし
    2: 申請手続きの案内のみ
    3: 会社が申請を代行・費用負担（専門職に限定）
    4: 職種を問わず申請を代行・費用負担し、実績が公開されている
    5: 上記に加え家族帯同・永住権取得まで支援
- id: living_support
  qid: Q8
  name: 衣食住サポートの充実度
  basis: 調査から総合的に評価
  levels:
    1: 言及なし
    2: 一般社員向けの住宅手当・社宅のみ
    3: 住宅に加え社員食堂など生活基盤がある
    4: 外国人向けの住居探し・生活立ち上げ支援がある
    5: 住居・食（宗教対応含む）・生活相談を一体で提供
- id: community_erg
  qid: Q9
  name: 外国人向けコミュニティ・ERGの有無
  basis: 調査から総合的に評価
  levels:
    1: なし
    2: 単発のイベント・セミナーのみ
    3: 社内に非公式なコミュニティがある
    4: 公式なERGがある
    5: 公式ERGがあり、参加人数・活動実績が公開されている
- id: culture_religion
  qid: Q10
  name: 文化・宗教への配慮の充実度
  basis: 調査から総合的に評価
  levels:
    1: 言及なし
    2: 人権方針等に宗教差別の禁止を記載
    3: 研修・啓発を実施している
    4: 祈祷室または宗教対応食のいずれかを提供
    5: 祈祷室・宗教対応食・服装／休暇の配慮を複数提供
- id: home_leave
  qid: Q11
  name: 長期帰国休暇の取りやすさ
  basis: 調査から総合的に評価
  levels:
    1: 言及なし
    2: 法定の年次有給休暇のみ
    3: 連続休暇制度がある（5日程度）
    4: 連続休暇制度が明文化され、取得が必須化されている
    5: 帰国を目的とした長期休暇制度・渡航費支援がある
- id: global_offices
  qid: Q12
  name: グローバル拠点数
  basis: 指定
  levels:
    1: 海外拠点なし
    2: 1〜2か国に拠点
    3: 3〜5か国に拠点
    4: 6〜10か国に拠点
    5: 11か国以上に拠点
- id: global_review_score
  qid: Q13
  name: グローバル口コミサイトのスコア
  basis: 調査から総合的に評価
  levels:
    1: 2.5未満
    2: 2.5以上3.0未満
    3: 3.0以上3.5未満
    4: 3.5以上4.0未満
    5: 4.0以上
- id: foreigner_reviews
  qid: Q14
  name: 外国人の口コミによる評価度
  basis: 調査から総合的に評価
  levels:
    1: 確認できない、または2.5未満
    2: 2.5以上3.0未満
    3: 3.0以上3.5未満
    4: 3.5以上4.0未満
    5: 4.0以上
